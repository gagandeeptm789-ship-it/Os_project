<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memory Monitor</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; }
        body { margin: 0; background: #f3f6f8; color: #17212b; }
        main { max-width: 960px; margin: 0 auto; padding: 32px 20px; }
        h1 { margin-top: 0; }
        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
        .card { background: white; border: 1px solid #d9e1e6; border-radius: 8px; padding: 18px; }
        .label { color: #5d6b75; font-size: 0.9rem; }
        .value { display: block; font-size: 1.8rem; font-weight: 700; margin-top: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 0; border-bottom: 1px solid #e5eaed; text-align: left; }
        th { color: #5d6b75; font-size: 0.85rem; }
        .error { color: #a33a2b; }
    </style>
</head>
<body>
    <main>
        <h1>Memory Monitor</h1>
        <section class="metrics" aria-label="Memory metrics">
            <div class="card"><span class="label">Total memory</span><strong class="value" id="total">Loading...</strong></div>
            <div class="card"><span class="label">Used memory</span><strong class="value" id="used">Loading...</strong></div>
            <div class="card"><span class="label">Available memory</span><strong class="value" id="available">Loading...</strong></div>
            <div class="card"><span class="label">Usage</span><strong class="value" id="percent">Loading...</strong></div>
        </section>
        <section class="card" style="margin-top: 16px">
            <h2>Top processes</h2>
            <table>
                <thead><tr><th>PID</th><th>Name</th><th>Memory</th><th>Usage</th></tr></thead>
                <tbody id="processes"><tr><td colspan="4">Loading...</td></tr></tbody>
            </table>
        </section>
        <p id="status" class="label" aria-live="polite"></p>
    </main>
    <script>
        async function loadDashboard() {
            try {
                const memory = await fetch('/api/memory').then(response => response.json());
                document.querySelector('#total').textContent = `${memory.total} GB`;
                document.querySelector('#used').textContent = `${memory.used} GB`;
                document.querySelector('#available').textContent = `${memory.available} GB`;
                document.querySelector('#percent').textContent = `${memory.percent}%`;

                const processes = await fetch('/api/processes').then(response => response.json());
                document.querySelector('#processes').innerHTML = processes.map(process =>
                    `<tr><td>${process.pid}</td><td>${process.name || 'Unknown'}</td><td>${process.memory} MB</td><td>${process.percent}%</td></tr>`
                ).join('');
                document.querySelector('#status').textContent = `Updated ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                document.querySelector('#status').textContent = 'Unable to load monitoring data.';
                document.querySelector('#status').className = 'error';
            }
        }
        loadDashboard();
        setInterval(loadDashboard, 5000);
    </script>
</body>
</html>
